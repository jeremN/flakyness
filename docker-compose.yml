# Flackyness - Full Stack Deployment
# Usage: docker compose up -d

services:
  # ==========================================================================
  # Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: flackyness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flackyness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flackyness"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flackyness

  # ==========================================================================
  # API (Hono Backend)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flackyness-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/flackyness
      API_PORT: 8080
      API_HOST: 0.0.0.0
      DASHBOARD_URL: http://localhost:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN environment variable is required}
      READ_TOKEN: ${READ_TOKEN:-}
      # Trusts X-Forwarded-For only from the dashboard container's fixed
      # address below (172.28.0.10) — never the whole 172.28.0.0/16 range: a
      # published port lets Docker's userland proxy present external traffic
      # as a bridge address, which would let an internet client spoof this
      # header and evade the login throttle. See docs/GETTING_STARTED.md.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.28.0.10}
    ports:
      - "8080:8080"
    healthcheck:
      # 127.0.0.1, never `localhost`: in node:24-alpine `localhost` resolves to
      # ::1 first, the server listens on 0.0.0.0 (IPv4 only), the check is
      # refused, the container stays unhealthy and the dashboard never starts.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - flackyness

  # ==========================================================================
  # Dashboard (SvelteKit Frontend)
  # ==========================================================================
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: flackyness-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The dashboard calls the API from its own server side only (never from
      # the browser), so this is the API's address INSIDE the compose
      # network. `localhost` here would be the dashboard container itself,
      # where nothing listens on 8080: every page would redirect to /login.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:8080}
      PORT: 3000
      HOST: 0.0.0.0
      # Required for the admin console's write actions (create/patch/rotate/
      # prune/delete — plan 053) to work at all. SvelteKit's CSRF check
      # compares the browser's Origin header against the dashboard's own
      # origin; without ORIGIN set, adapter-node assumes https, so every
      # same-origin POST over plain http 403s as "cross-site". Read at
      # container start by apps/dashboard/runtime/server.js. Set this to the externally
      # visible URL the dashboard is served from (with a reverse proxy in
      # front, that is the proxy's https URL, not this container's own
      # http port).
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Marks the dashboard's own session cookie (set at /login) `Secure`.
      # From plan 059 on this is the ONLY session cookie a browser ever
      # holds — the API's own Set-Cookie is consumed server-side and never
      # reaches the browser (see apps/dashboard/src/lib/server/session.ts).
      # Deliberately two-way (unset -> false), NOT a mirror of the API's own
      # three-way isCookieSecure(): this compose file sets NODE_ENV=production
      # with a plain-http ORIGIN by default, and falling back to
      # NODE_ENV==='production' here would mark the cookie Secure over http —
      # the browser would silently drop it and sign-in would break. Set to
      # `true` once the dashboard is actually served over https (e.g. behind
      # a TLS-terminating reverse proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Presented as a Bearer credential on every SSR call to the API (see
      # apps/dashboard/src/lib/server/api.ts). Must match the API's
      # READ_TOKEN above — set both or neither. If the API's is set and this
      # one isn't, every dashboard page 500s instead of loading.
      READ_TOKEN: ${READ_TOKEN:-}
      # Reverse proxies whose X-Forwarded-For the dashboard trusts, to find
      # each visitor's address (read by apps/dashboard/runtime/server.js).
      # Unset: the dashboard uses the socket address, which behind a proxy is
      # the proxy's for everyone, so all users share one login rate-limit
      # bucket. With nginx on the host, set it to this network's gateway
      # (172.28.0.1) AND set DASHBOARD_PUBLISH=127.0.0.1:3000, so that only
      # the host can reach the port. Never trust the gateway while the port is
      # published on every interface: outside traffic can arrive from that
      # address too. See docs/GETTING_STARTED.md "Reverse Proxy".
      DASHBOARD_TRUSTED_PROXY_IPS: ${DASHBOARD_TRUSTED_PROXY_IPS:-}
    ports:
      - "${DASHBOARD_PUBLISH:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Fixed address (long-form mapping, unlike postgres/api's short-form
    # list above) so the API can trust exactly this one container as its
    # X-Forwarded-For source — see TRUSTED_PROXY_IPS on the api service.
    networks:
      flackyness:
        ipv4_address: 172.28.0.10

networks:
  flackyness:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
