<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bad</title>
  <link rel="canonical" href="https://staging.example.test/bad">
  <link rel="canonical" href="https://www.example.test/bad">
  <link rel="alternate" hreflang="english" href="/bad-en.html">
  <script type="application/ld+json">{"@type": "WebPage", broken}</script>
  <style>.faint{color:#bbb;background:#fff}</style>
</head>
<body>
  <!-- Deliberate defects: no lang, no viewport, no description, 2 h1,
       2 conflicting canonicals, invalid hreflang, broken JSON-LD,
       missing alt, unlabelled input, low contrast, layout shift, long task. -->
  <h1>Bad page</h1>
  <h1>Second heading</h1>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <input type="text">
  <p class="faint">Low contrast text</p>
  <div id="slot"></div>
  <script>
    // Long task after first paint (TBT) and a late layout shift (CLS).
    setTimeout(() => {
      const end = performance.now() + 400;
      while (performance.now() < end) {}
      const banner = document.createElement('div');
      banner.style.height = '300px';
      banner.textContent = 'Late banner';
      document.body.insertBefore(banner, document.body.firstChild);
    }, 300);
  </script>
</body>
</html>
