# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # JavaScript / TypeScript dependencies for the whole pnpm workspace.
  # ONE entry, root "/" only. Dependabot's npm updater understands pnpm
  # workspaces: from "/" it updates every package matched by the
  # `packages` globs in pnpm-workspace.yaml (apps/*, packages/*) and
  # regenerates the root pnpm-lock.yaml in the same PR.
  # Do NOT add "/apps/api", "/apps/dashboard" or any other workspace
  # subdirectory here:
  #   - each subdirectory entry opens a second PR for the same bump, with
  #     no lockfile change (seen: #174-#178 and #184 duplicated #180-#183);
  #   - security updates fail on a subdirectory with pnpm
  #     `misconfigured_tooling` ("Updating workspaces from inside a
  #     workspace subdirectory is not supported").
  # A new app is covered when it matches a pnpm-workspace.yaml glob.
  # `apps/api/src/dependabot-coverage.test.ts` enforces both rules.
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Don't propose versions younger than pnpm's minimumReleaseAge (24h in
    # pnpm-workspace.yaml) — otherwise the lockfile-sync workflow can't resolve
    # them and the PR fails. 2 days gives margin over the 24h gate.
    cooldown:
      default-days: 2
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # @types/node must track the Node runtime (24) — never the newest types
      # release (25+ targets a Node version we don't run).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are adopted by hand, for the whole workspace.
      # apps/dashboard must stay on TS 6: svelte-check 4.x cannot run under
      # TypeScript 7, because TS 7.0 ships no stable programmatic API, which
      # Svelte's template type-checking needs (see AGENTS.md sharp edges and
      # PR #62). The API is expected in TS 7.1 (~Oct 2026, upstream
      # estimate). svelte-check's peer range claims `typescript: ">=5.0.0"`,
      # so nothing stops the install — only this rule does. apps/api is
      # already on TS 7 (plan 023). Lift the dashboard pin by hand only once
      # BOTH TS 7.1 has shipped AND a svelte-check release supports it
      # (latest is still 4.7.2) — track `sveltejs/language-tools#2733`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Batch low-risk updates into a few PRs instead of one-per-package.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by any workflows under .github/workflows.
  # No-ops harmlessly until workflows are added.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
